apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.fullname" . }}-backend-secrets
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and .Values.backend.secrets .Values.backend.secrets.databaseUrl }}
  database-url: {{ .Values.backend.secrets.databaseUrl | b64enc | quote }}
  {{- else }}
  database-url: ""
  {{- end }}
  {{- if and .Values.backend.secrets .Values.backend.secrets.jwtSecret }}
  jwt-secret: {{ .Values.backend.secrets.jwtSecret | b64enc | quote }}
  {{- else }}
  jwt-secret: ""
  {{- end }}